# docker-compose.yml
# ──────────────────────────────────────────────────────────────────────────────
# Spin up a single-node Kafka broker in KRaft mode (no ZooKeeper required).
# Uses Confluent Platform 7.6.0 which ships with Kafka 3.6.
#
# Usage:
#   docker-compose up -d          # start in background
#   docker-compose logs -f kafka  # follow broker logs
#   docker-compose down           # stop and remove containers
# ──────────────────────────────────────────────────────────────────────────────

version: "3.8"

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-broker
    hostname: kafka
    ports:
      - "9092:9092"       # PLAINTEXT listener for Python clients
      - "9101:9101"       # JMX metrics (optional)
    environment:
      # ── KRaft mode (no ZooKeeper) ──────────────────────────────────────────
      KAFKA_NODE_ID                       : 1
      KAFKA_PROCESS_ROLES                 : broker,controller
      KAFKA_LISTENERS                     : PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS          : PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS      : 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES     : CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME    : PLAINTEXT

      # ── Broker settings ────────────────────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR        : 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR           : 1
      KAFKA_DEFAULT_REPLICATION_FACTOR              : 1
      KAFKA_NUM_PARTITIONS                          : 3
      KAFKA_LOG_RETENTION_HOURS                     : 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE               : "true"

      # ── JMX (optional monitoring) ──────────────────────────────────────────
      KAFKA_JMX_PORT           : 9101
      KAFKA_JMX_HOSTNAME       : localhost

      # ── Cluster ID (deterministic for reproducibility) ────────────────────
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  kafka_data:
    driver: local
